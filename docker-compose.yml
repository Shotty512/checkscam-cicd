services:
  mysql:
    image: mysql:8.0
    container_name: checkscam-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: scamdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - checkscam-internal

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    mem_limit: 8g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    build:
      context: ./checkscam-develop
      dockerfile: Dockerfile

    container_name: checkscam-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scamdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}

      SPRING_LIQUIBASE_ENABLED: "true"
      SERVER_PORT: 8080

      CHECKSCAM_JWT_BASE64_SECRET: ${JWT_SECRET:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      GOOGLE_RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:?}

      TZ: Asia/Ho_Chi_Minh

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - backend_uploads:/app/uploads

    networks:
      - checkscam-internal
      - checkscam-public

    expose:
      - "8080"

    ports:
      - "8082:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    mem_limit: 4g
    cpus: 4.0

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./fe-checkscam-develop
      dockerfile: Dockerfile

    container_name: checkscam-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - checkscam-public

    mem_limit: 2g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  nginx-proxy:
    image: nginx:alpine
    container_name: checkscam-nginx
    restart: unless-stopped
    ports:
      - "8017:80"
    volumes:
      - /etc/nginx/nginx-tuan/conf-checkscam.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    networks:
      - checkscam-public
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: checkscam-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  checkscam-internal:
    driver: bridge
    internal: true

  checkscam-public:
    driver: bridge

volumes:
  mysql_data:
    name: checkscam-mysql-data

  backend_uploads:
    name: checkscam-backend-uploads

  certbot_etc:
    name: checkscam-certbot-etc
